    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PAYE Modernisation Web Services</title>
    <!-- Bootstrap 5: still required for .card, .col-sm, .row, .stretched-link on home/card pages -->
    <!-- TODO: Replace Bootstrap classes in content HTML with native equivalents and remove this -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PrimeIcons: loaded here so it works for static pages that don't go through the SCSS pipeline -->
    <link href="./node_modules/primeicons/primeicons.css" rel="stylesheet">
    <!-- REVDS custom stylesheet: compiled from assets/css/styles.scss -->
    <link href="./assets/css/styles.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-0">

        <!-- Top utility bar -->
        <div class="header-util">
            <span class="header-util__context">PAYE Modernisation Web Services</span>
            <a class="header-util__link" href="https://www.revenue.ie/en/online-services/support/software-developers/index.aspx" target="_blank" rel="noopener noreferrer">Help</a>
        </div>

        <!-- Main header -->
        <header class="header">
            <a class="header__logo" href="#/">
                <img alt="Revenue — Irish Tax and Customs" height="80" width="185" src="./assets/images/ictl_logo.png">
            </a>
            <div class="header__divider" aria-hidden="true"></div>
            <div class="header__app-name">
                PAYE Modernisation / ERR Documentation
            </div>
        </header>

        <!-- Navbar -->
        <nav class="site-nav navbar navbar-expand-md">
            <div class="container-fluid">
                <!-- Home link always visible -->
                <a class="site-nav__home" href="#/">Home</a>

                <!-- Hamburger toggle for small screens -->
                <button class="navbar-toggler site-nav__toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navLinks"
                    aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon site-nav__hamburger"></span>
                </button>

                <!-- Nav links injected by router -->
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav site-nav__links" id="navLinksList">
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main content -->
        <main class="site-main">
            <div id="content">
                <!-- Content will be loaded here -->
            </div>
        </main>

    </div>

    <footer class="footer">
    </footer>

    <script src="./assets/js/router.js"></script>
    <!-- Bootstrap JS: required for navbar collapse/toggle (hamburger menu on mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
